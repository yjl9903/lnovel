name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - deps

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.6.0
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:ci
